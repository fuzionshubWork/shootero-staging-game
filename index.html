<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Shootero</title>
    <link rel="icon" type="image/png" href="TemplateData/game-icon.png">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      /* ===== Ideofuzion template - responsive letterbox + loading UI =====
         All overrides live inline here because Unity regenerates TemplateData/style.css
         on every build; !important beats it. Shootero is a portrait (9:16) game. */

      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #0e0e12;
        touch-action: none;                 /* don't let the browser eat drags/clicks */
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      }

      /* Full-viewport shell. Solid dark = clean loading backdrop + clean letterbox bars. */
      #unity-container {
        position: fixed; inset: 0;
        background: #0e0e12;
      }

      /* Canvas is positioned by JS (letterbox). Transparent so the backdrop shows through
         while loading; Unity fills it once the game renders. */
      #unity-canvas {
        display: block; position: absolute;
        background: transparent !important;
      }

      /* ---- Loading bar ---- */
      #unity-loading-bar {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        display: none; z-index: 10; text-align: center;
      }
      #unity-logo {
        width: 180px; height: 180px; margin: 0 auto 12px;
        background: url('TemplateData/game-icon.png') center / contain no-repeat;
      }
      /* Spinner shown while the per-game icon is being fetched. Removed as soon as a
         partner icon is applied, and torn down with the rest of the loading UI either way. */
      #unity-logo-spinner {
        width: 34px; height: 34px; margin: 0 auto 10px;
        border: 3px solid rgba(255, 255, 255, 0.18);
        border-top-color: rgba(255, 255, 255, 0.85);
        border-radius: 50%;
        animation: gb-spin 0.9s linear infinite;
      }
      @keyframes gb-spin { to { transform: rotate(360deg); } }
      #unity-progress-bar-empty {                 /* track */
        width: 300px; height: 18px; margin: 12px auto 0;
        background: #d9d9d9 !important; background-image: none !important;
        border-radius: 9px; overflow: hidden;
      }
      #unity-progress-bar-full {                  /* fill */
        width: 0%; height: 100%;
        background: #1C3A5B !important; background-image: none !important;
        margin-top: 0 !important;                 /* fix: default style.css pushes it down */
        border-radius: 9px; transition: width 0.1s ease;
      }
      #unity-progress-percent {                   /* % readout */
        color: #F2F2F2; font: 14px arial, sans-serif; margin-top: 6px;
      }

      /* No footer in this build. */
      #unity-footer { display: none !important; }
      #unity-warning {
        position: absolute; left: 50%; top: 5%; transform: translate(-50%);
        background: white; padding: 10px; display: none; z-index: 20;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=540 height=960 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-logo-spinner"></div>
        <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
        <div id="unity-progress-percent">0%</div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // ===== Responsive letterbox: largest rect of the game's aspect that fits, centered =====
      // Aspect comes from the player's web canvas size (Player Settings -> 1080 x 1920 = 9:16).
      var GAME_ASPECT = 540 / 960;
      function resizeCanvas() {
        var availW = window.innerWidth, availH = window.innerHeight, w, h;
        if (availW / availH > GAME_ASPECT) { h = availH; w = Math.round(h * GAME_ASPECT); }
        else                               { w = availW; h = Math.round(w / GAME_ASPECT); }
        canvas.style.width  = w + "px";
        canvas.style.height = h + "px";
        canvas.style.left   = Math.round((availW - w) / 2) + "px";
        canvas.style.top    = Math.round((availH - h) / 2) + "px";
      }
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      // ===== Single source of truth for the loading bar + percent =====
      function setLoadProgress(p) {
        var pct  = Math.round(p * 100);
        var full = document.querySelector("#unity-progress-bar-full");
        var txt  = document.querySelector("#unity-progress-percent");
        if (full) full.style.width = pct + "%";
        if (txt)  txt.innerText    = pct + "%";
      }

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function () { warningBanner.removeChild(div); updateBannerVisibility(); }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Staging.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Staging.data.unityweb",
        frameworkUrl: buildUrl + "/Staging.framework.js.unityweb",
        codeUrl: buildUrl + "/Staging.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Shootero",
        productName: "Shootero",
        productVersion: "1.6",
        showBanner: unityShowBanner,
        // Render buffer tracks the CSS (letterboxed) canvas size -> responsive, no distortion.
        matchWebGLToCanvasSize: true,
      };

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, setLoadProgress).then((unityInstance) => {
          window.unityInstance = unityInstance;

          // Force 100% before hiding (Unity's onProgress plateaus at 0.9).
          setLoadProgress(1);

          // Safari/WebKit keeps painting loading elements even after display:none on a parent.
          // Hide each explicitly, clear its background image, then REMOVE it from the DOM.
          function killEl(sel) {
            var el = document.querySelector(sel);
            if (!el) return;
            el.style.display = "none";
            el.style.visibility = "hidden";
            el.style.opacity = "0";
            el.style.backgroundImage = "none";
            if (el.parentNode) el.parentNode.removeChild(el);
          }
          killEl("#unity-logo");
          killEl("#unity-logo-spinner");
          killEl("#unity-progress-bar-full");
          killEl("#unity-progress-bar-empty");
          killEl("#unity-progress-percent");
          killEl("#unity-loading-bar");

          resizeCanvas();

          // ===== Page <-> game bridge (GameBull) =====
          // Shootero reads its boot params straight from the URL query string in
          // GameBullBoot, so we only announce readiness here. If a SendMessage-style
          // handshake is ever needed, forward the payload via
          // unityInstance.SendMessage('<BridgeObject>', '<Method>', payload).
          try { window.parent.postMessage({ type: 'game:ready' }, '*'); } catch (e) {}
        }).catch((message) => { alert(message); });
      };
      document.body.appendChild(script);

      // ===== Dynamic loading-screen icon (GameBull /context) =====
      //
      // The loading screen is shown BEFORE Unity boots, so C# cannot set it — this has to
      // happen here, in the template's own JavaScript.
      //
      // Started AFTER the Unity loader above is already queued, and written fire-and-forget:
      // nothing in here may delay or block the build download.
      //
      // gameId is read from the URL like every other boot param and is treated as REQUIRED.
      // It is deliberately not hardcoded: a hardcoded id that did not match this game would
      // still be a valid id for a DIFFERENT game, so a mismatch would quietly fetch that
      // game's context and put its logo on our loading screen — the same failure the tenant
      // -wide logoUrl field causes. Missing param -> keep the static icon, which is correct
      // and obvious.
      (function applyPartnerLoadingIcon() {
        try {
          var q          = new URLSearchParams(window.location.search);
          var tenantSlug = q.get("tenantSlug");
          var token      = q.get("sessionToken") || q.get("bootToken") || q.get("token");
          var gameId     = q.get("gameId");
          var apiBase    = q.get("apiBase") || "https://api.staging.g-b.store";

          // Anything missing -> leave the static icon in place. No error, no blank screen.
          if (!tenantSlug || !token || !gameId) return;

          // Hard timeout so a slow API can never leave the icon stuck on the spinner.
          var ctl   = new AbortController();
          var timer = setTimeout(function () { ctl.abort(); }, 4000);

          fetch(apiBase.replace(/\/+$/, "")
                  + "/play/games/" + encodeURIComponent(gameId)
                  + "/context?tenantSlug=" + encodeURIComponent(tenantSlug),
                { method: "GET",
                  headers: { "Authorization": "Bearer " + token },
                  signal: ctl.signal })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (data) {
              clearTimeout(timer);
              if (!data) return;                       // 401 / 404 -> static icon
              var c = data.customization || {};

              // PER-GAME fields only, in this order. logoUrl / tenantLogoUrl / assets[]
              // are tenant-wide and have been seen returning another game's artwork, and
              // assets[] belongs to the in-game art path handled by the C# SDK.
              var iconUrl =
                (typeof c.gameLogoUrl   === "string" && c.gameLogoUrl)   ? c.gameLogoUrl   :
                (typeof c.gameBannerUrl === "string" && c.gameBannerUrl) ? c.gameBannerUrl : null;
              if (!iconUrl) return;                    // admin uploaded none -> static icon

              // Preload, then swap only once the image has actually decoded, so a slow or
              // broken URL can never flash or blank the loading screen.
              var img = new Image();
              img.onload = function () {
                var el = document.querySelector("#unity-logo");
                if (!el) return;                       // loading UI already torn down
                el.style.backgroundImage = 'url("' + iconUrl.replace(/"/g, "%22") + '")';
                var sp = document.querySelector("#unity-logo-spinner");
                if (sp && sp.parentNode) sp.parentNode.removeChild(sp);
              };
              img.onerror = function () { /* keep the static icon */ };
              img.src = iconUrl;
            })
            .catch(function () { clearTimeout(timer); });   // network / abort -> static icon
        } catch (e) { /* no URLSearchParams / no fetch -> static icon */ }
      })();
    </script>
  </body>
</html>
